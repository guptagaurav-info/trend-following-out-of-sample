    sha256: 903dbb965979f8b92a60b01524372f42be0e4bf88c291caf87171a286149be32
  stock_dividend_events.parquet:
    url: https://huggingface.co/datasets/defeatbeta/yahoo-finance-data/resolve/main/data/US/stock_dividend_events.parquet
