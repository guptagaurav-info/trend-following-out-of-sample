# All choices fixed before results were examined.
raw_dir: data/raw
out_dir: reports
sma_months: 10          # Faber (2007)
mom_months: 12          # Moskowitz, Ooi & Pedersen (2012)
cost_bps: 5             # per unit of position change, ETF-level cost
cost_bps_stress: 25     # cost stress test
shiller_end: "2023-06-01"   # last month with dividends in the Shiller mirror
publication_date: "2007-06-01"  # Faber's paper first circulated in 2006-07; test window starts here
allocation_usd: 1000000000  # illustrative $1bn equity allocation
sources:
  shiller_sp500_monthly.csv:
    url: https://raw.githubusercontent.com/datasets/s-and-p-500/main/data/data.csv
    sha256: 3a45dffabc414afc298c12159abc84c2875f88175ff3d4473ef7417e725ecac6
  prices.parquet:
